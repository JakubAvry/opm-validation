  # ---------------------------------------------------------------- 14.2.3 Fact consistency

  - id: OPM-14-080
    iso: 14.2.3
    page: 94
    strength: shall
    covers: 1
    source: ISO
    category: 5
    rule: "A fact in one OPD is true for the whole model."
    check:
      by: none
      reason: "Semantics the validator applies: facts of all OPD paragraphs form one model."
    severity: null
    tests: []

  - id: OPM-14-081
    iso: 14.2.3
    page: 94
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: >-
      No OPD contains a fact that contradicts a fact of the same or another OPD (e.g. "P yields A." and
      "P consumes A."); a refinement of a fact is not a contradiction.
    check:
      by: shacl
      core: true
      plan: >-
        The processes that consume an object and those that yield it are disjoint (sh:disjoint on direct role
        properties). The same for every pair of the five roles of an object towards one
        process (consumed by, yielded by, affected by, agent of, instrument of) over the whole model: "P consumes
        A." in SD and "P requires A." at the contour of P in SD1 contradict each other (consumed x unchanged,
        9.2.1), while "affects" and "changes ... from ... to ..." are one role (the refinement the norm allows).
        Two such links in one OPD paragraph are the double link of OPM-8-004 and are reported once, there.
      status: implemented
    shape: |
      opms:OPM-14-081 a sh:NodeShape ; opm:rule "OPM-14-081" ; opm:profile "both" ;
          sh:targetClass opm:Object ;
          sh:property [ sh:path opm:consumedBy ;
                        sh:disjoint opm:yieldedBy, opm:affectedBy, opm:agentOf, opm:instrumentOf ] ;
          sh:property [ sh:path opm:yieldedBy ; sh:disjoint opm:affectedBy, opm:agentOf, opm:instrumentOf ] ;
          sh:property [ sh:path opm:affectedBy ; sh:disjoint opm:agentOf, opm:instrumentOf ] ;
          sh:property [ sh:path opm:agentOf ; sh:disjoint opm:instrumentOf ] ;
          sh:severity sh:Violation ; sh:message "the object has two different roles for one process" .
    severity: E
    message: "Contradicting facts: \"{sentence1}\" (line {line1}) and \"{sentence2}\" (line {line2})."
    hint: "Keep the one that holds; if the object is consumed and created again, the process affects it."
    tests: []

