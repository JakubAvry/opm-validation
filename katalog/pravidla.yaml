  - id: OPM-14-091
    iso: 14.2.4.1.3
    page: 96
    strength: shall
    covers: 4
    source: ISO
    category: 2
    rule: "Within each kind, an event link is stronger and a condition link weaker than the basic link."
    check:
      by: shacl
      core: false
      plan: >-
        Extension of the shape of OPM-14-086: when the abstract link has the prevailing kind, it carries the
        strongest modifier of the links of that kind to the subprocesses (event > none > condition). Compared:
        condition or not. An event link from outside to a subprocess is itself reported by OPM-14-054, so an
        event there is counted as "not a condition" (one cause, one entry), and an event link on the abstract
        process with plain links inside is the form 14.2.2.4.2 asks for. Not compared after a Table 27
        combination (consumption with result gives effect) and for the enabler of N-050.
      status: implemented
    shape: |
      # focus = the link in the abstract OPD, value = the modifier it should have ("condition" or "none")
      opms:OPM-14-091 a sh:NodeShape ; opm:rule "OPM-14-091" ; opm:profile "both" ;
          sh:targetClass opm:ProceduralLink ;
          sh:sparql [ sh:prefixes opms:prefixes ; sh:message "abstract link has not the strongest modifier of the links to the subprocesses" ;
              sh:select """
                  SELECT DISTINCT $this ?value WHERE {
                      $this opm:object ?b ; opm:process ?p ; opm:inOPD ?d .
                      ?z a opm:InZoom ; opm:refines ?p ; opm:childOPD ?d1 . FILTER (?d1 != ?d)
                      ?c a opm:ProceduralLink ; opm:object ?b ; opm:process ?s . ?s opm:subprocessOf ?p .
                      BIND (EXISTS { ?c1 a opm:ConsumptionLink ; opm:object ?b ; opm:process ?s1 . ?s1 opm:subprocessOf ?p } AS ?hc)
                      BIND (EXISTS { ?c2 a opm:ResultLink ; opm:object ?b ; opm:process ?s2 . ?s2 opm:subprocessOf ?p } AS ?hr)
                      BIND (EXISTS { ?c3 a opm:EffectLink ; opm:object ?b ; opm:process ?s3 . ?s3 opm:subprocessOf ?p } AS ?he)
                      BIND (EXISTS { ?c4 a opm:AgentLink ; opm:object ?b ; opm:process ?s4 . ?s4 opm:subprocessOf ?p } AS ?ha)
                      FILTER (!(?hc && ?hr))
                      BIND (IF(?hc, opm:ConsumptionLink, IF(?hr, opm:ResultLink,
                            IF(?he, opm:EffectLink, IF(?ha, opm:AgentLink, opm:InstrumentLink)))) AS ?kind)
                      FILTER EXISTS { $this a ?kind }
                      BIND (EXISTS { ?n a ?kind ; opm:object ?b ; opm:process ?sn . ?sn opm:subprocessOf ?p .
                                     OPTIONAL { ?n opm:modifier ?mm } FILTER (!BOUND(?mm) || ?mm != "condition") } AS ?strong)
                      BIND (EXISTS { $this opm:modifier "condition" } AS ?cond)
                      FILTER (?cond = ?strong)
                      BIND (IF(?strong, "none", "condition") AS ?value)
                  }""" ] ;
          sh:severity sh:Warning .
    severity: W
    message: >-
      In {opd} "{object}" and "{process}" are linked by {link}, but the {kind} links to the subprocesses in {child}
      are {inside}; the link in {opd} takes the strongest of them.
    hint: "Use \"{expected}\" in {opd}."
    tests: []
    note: >-
      Checked as the norm says (14.2.4.1.3), reported as a warning: the
      modifier is a finer, secondary precedence and a mismatch is a minor fault. Found on reference case12 (Vacancy
      Report: only a conditional subprocess changes it, SD has a plain effect).

  - id: OPM-14-092
