  # ---------------------------------------------------------------- 14.2.2.4 Link distribution across context

  - id: OPM-14-049
    iso: 14.2.2.4.1
    page: 86
    strength: shall
    covers: 1
    source: ISO
    category: 5
    rule: "A link attached to an in-zoomed process is distributed to each of its subprocesses."
    check:
      by: none
      reason: >-
        Semantics the validator applies: an enabler or effect on the in-zoomed process counts for every
        subprocess (e.g. when checking that each subprocess transforms something).
    severity: null
    tests: []

  - id: OPM-14-050
    iso: 14.2.2.4.1
    page: 87
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: "An enabler attached to the contour of an in-zoomed process connects to at least one of its subprocesses."
    check:
      by: shacl
      core: false
      plan: >-
        With distribution (OPM-14-049) a link written at the contour in the OPD of the in-zoom is a link to each
        subprocess, so there the condition holds. What can fail in OPL is a link of the in-zoomed process stated
        in the parent OPD only: an enabler that the OPD of the in-zoom attaches neither to the contour nor to a
        subprocess, or a consumption or result link that no subprocess takes over (OPM-14-052). For every
        procedural link of an in-zoomed process in the parent OPD: its object, or a feature or part of it,
        has a procedural link in the child OPD. SHACL-SPARQL (links of two OPDs are compared). Needs OPD
        paragraphs.
      status: implemented
    shape: |
      opms:OPM-14-050 a sh:NodeShape ; opm:rule "OPM-14-050" ; opm:profile "both" ;
          sh:targetClass opm:ProceduralLink ;
          sh:sparql [ sh:prefixes opms:prefixes ; sh:message "link of an in-zoomed process has no counterpart in the OPD of the in-zoom" ;
              sh:select """
                  SELECT DISTINCT $this ?value WHERE {
                      $this opm:object ?o ; opm:process ?value ; opm:inOPD ?d .
                      ?z a opm:InZoom ; opm:refines ?value ; opm:childOPD ?c .
                      ?c opm:parentOPD ?d .
                      FILTER NOT EXISTS {
                          ?l a opm:ProceduralLink ; opm:inOPD ?c ; opm:object ?o2 .
                          ?o2 (opm:featureOf|^opm:hasPart|^opm:hasSpecialization|^opm:hasInstance)* ?o .
                      }
                  }""" ] ;
          sh:severity sh:Warning .
    severity: W
    message: >-
      In {opd} "{object}" is linked to "{process}" ("{sentence}"), but in {child}, where "{process}" is in-zoomed,
      "{object}" is linked neither to its contour nor to a subprocess.
    hint: "In {child} attach \"{object}\" to the subprocess that uses it (or to \"{process}\" itself, for an enabler or an effect)."
    tests: []
    note: >-
      Reported as W; the OPCloud references give no finding.

  - id: OPM-14-051
