  - id: OPM-14-088
    iso: 14.2.4.1.1
    page: 96
    strength: implicit
    covers: 0
    source: ISO
    category: 2
    rule: >-
      Table 27: within an in-zoomed process an object cannot be consumed and then consumed or affected by a later
      subprocess, nor affected or created and then created by a later one.
    check:
      by: shacl
      core: false
      plan: >-
        For two subprocesses of one in-zoomed process in zoom order: (consumes, consumes), (consumes, affects),
        (affects, yields) and (yields, yields) on the same object are violations.
      status: implemented
    shape: |
      # focus = the later link, value = the earlier one
      opms:OPM-14-088 a sh:NodeShape ; opm:rule "OPM-14-088" ; opm:profile "both" ;
          sh:targetClass opm:TransformingLink ;
          sh:sparql [ sh:prefixes opms:prefixes ; sh:message "impossible order of links within an in-zoomed process" ;
              sh:select """
                  SELECT DISTINCT $this ?value WHERE {
                      $this opm:object ?o ; opm:process ?s2 ; a ?k2 . ?s2 opm:subprocessOf ?p ; opm:stepOrder ?n2 .
                      ?value opm:object ?o ; opm:process ?s1 ; a ?k1 . ?s1 opm:subprocessOf ?p ; opm:stepOrder ?n1 .
                      FILTER (?n2 > ?n1)
                      FILTER NOT EXISTS { $this a opm:ChangeLink . ?value a opm:ChangeLink }
                      FILTER NOT EXISTS { ?value opm:modifier "condition" } FILTER NOT EXISTS { $this opm:modifier "condition" }
                      FILTER ((?k1 = opm:ConsumptionLink && (?k2 = opm:ConsumptionLink || ?k2 = opm:EffectLink))
                           || (?k1 = opm:EffectLink && ?k2 = opm:ResultLink)
                           || (?k1 = opm:ResultLink && ?k2 = opm:ResultLink))
                  }""" ] ;
          sh:severity sh:Warning .
    severity: W
    message: >-
      Not possible in this order for one instance: "{sentence1}" then "{sentence2}" - {reason}.
    hint: >-
      If these are different instances, show it (multiplicity or separate objects); otherwise change the order of the
      subprocesses or the links.
    tests: []
    note: >-
      Stated only in Table 27 (Invalid cells). Warning, not error: 14.2.2.4.1 allows several operational instances
      of one object created or consumed by different processes and only asks the modeller to be careful; OPL does
      not show instances. Found on the references case9 and case16 (two meetings, two responses).

  - id: OPM-14-093
    iso: 14.2.2.6.1.4
    page: 93
    strength: implicit
    covers: 0
    source: ISO
