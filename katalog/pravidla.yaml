  - id: OPM-10-037
    iso: 10.3.3.1
    page: 49
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: "An attribute is a feature that is an object."
    check:
      by: shacl
      core: true
      plan: >-
        Things listed as attributes of an exhibitor are objects; things listed as operations are processes
        (the sentence separates the two lists with "as well as").
      status: implemented
    shape: |
      opms:OPM-10-037 a sh:NodeShape ; opm:rule "OPM-10-037" ; opm:profile "both" ;
          sh:targetClass opm:ExhibitionLink ;
          sh:or (
              [ sh:not [ sh:property [ sh:path opm:featureRole ; sh:hasValue "attribute" ] ] ]
              [ sh:property [ sh:path opm:target ; sh:not [ sh:class opm:Process ] ] ]
          ) ;
          sh:or (
              [ sh:not [ sh:property [ sh:path opm:featureRole ; sh:hasValue "operation" ] ] ]
              [ sh:property [ sh:path opm:target ; sh:not [ sh:class opm:Object ] ] ]
          ) ;
          sh:severity sh:Violation ; sh:message "attribute that is a process or operation that is an object" .
    severity: E
    message: >-
      "{thing}" is listed as {role} of "{exhibitor}", but it is {kind}.
    hint: >-
      For an object exhibitor list the attributes first, then "as well as" and the operations; for a process
      exhibitor the operations first.
    tests: []

