  - id: OPM-10-068
    iso: 10.3.4.3
    page: 55
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: >-
      With several discriminating attributes, the number of specializations is at most the product of the
      numbers of their values.
    check:
      by: shacl
      core: false
      plan: >-
        The product itself is not expressible (SPARQL has no product aggregate). Equivalent check: no two specializations of one general fix the same combination of values of its
        discriminating attributes; with every specialization fixing all of them, exceeding the product is only
        possible through such a duplicate. A value is fixed by "Attribute of Special is value." or by a
        state-specified characterization ("Special exhibits value Attribute.", 10.4.1).
      status: implemented
    shape: |
      # focus = the later specialization, value = the earlier one with the same fixed values
      opms:OPM-10-068 a sh:NodeShape ; opm:rule "OPM-10-068" ; opm:profile "both" ;
          sh:targetSubjectsOf opm:specializes ;
          sh:sparql [ sh:prefixes opms:prefixes ; sh:message "two specializations fix the same attribute values" ;
              sh:select """
                  SELECT DISTINCT $this ?value WHERE {
                      $this opm:specializes ?g . ?value opm:specializes ?g . FILTER (STR(?value) < STR($this))
                      ?a opm:featureOf $this ; opm:value ?v .
                      FILTER NOT EXISTS {
                          { ?x opm:featureOf $this ; opm:featureName ?n ; opm:value ?vx .
                            OPTIONAL { ?y opm:featureOf ?value ; opm:featureName ?n ; opm:value ?vy . FILTER (?vy = ?vx) }
                            FILTER (!BOUND(?y)) }
                          UNION
                          { ?y2 opm:featureOf ?value ; opm:featureName ?n2 ; opm:value ?vy2 .
                            OPTIONAL { ?x2 opm:featureOf $this ; opm:featureName ?n2 ; opm:value ?vx2 . FILTER (?vx2 = ?vy2) }
                            FILTER (!BOUND(?x2)) }
                      }
                  }""" ] ;
          sh:severity sh:Warning .
      # OPTIONAL + !BOUND instead of a nested FILTER NOT EXISTS (rdflib 7 evaluates the nested form wrongly).
    severity: W
    message: >-
      "{special1}" and "{special2}" fix the same values of the discriminating attributes of "{general}" ({values}).
    hint: "Give each specialization its own combination of values, or merge the two."
    tests: []
    note: "Warning: covers the bound only when every specialization fixes all discriminating attributes."

