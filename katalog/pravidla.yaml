      Not a valid multiplicity in "{sentence}": the multiplicity goes directly before the object name ({detail}).
    hint: "E.g. \"Table consists of 4 Legs and Top.\""
    tests: []
    note: >-
      Plural agreement is not checked: it needs English morphology (candidate for a W check with an inflection
      library). OPCloud forms the plural correctly but writes "1 Legs" for the number 1.

