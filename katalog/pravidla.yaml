  - id: OPM-10-070
    iso: 10.3.5.1
    page: 56
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: >-
      If the class gives an attribute a range of values, the value of that attribute for each instance lies
      within the range.
    check:
      by: shacl
      core: false
      plan: >-
        For every value of an attribute of an instance: if the class (or a general of it) gives the attribute a
        range, the value lies within it. SHACL-SPARQL: compares values of two different nodes.
      status: implemented
    shape: |
      opms:OPM-10-070 a sh:NodeShape ; opm:rule "OPM-10-070" ; opm:profile "both" ;
          sh:targetSubjectsOf opm:value ;
          sh:sparql [ sh:prefixes opms:prefixes ; sh:message "value outside the range given by the class" ;
              sh:select """
                  SELECT $this ?value WHERE {
                      $this opm:value ?value ; opm:featureName ?fname ; opm:featureOf ?owner .
                      ?owner (opm:specializes|opm:instanceOf)* ?anc .
                      ?attr opm:featureOf ?anc ; opm:featureName ?fname ; opm:rangeMin ?min ; opm:rangeMax ?max .
                      BIND (xsd:decimal(REPLACE(STR(?value), ",", ".")) AS ?v)
                      BIND (xsd:decimal(REPLACE(STR(?min), ",", ".")) AS ?lo)
                      BIND (xsd:decimal(REPLACE(STR(?max), ",", ".")) AS ?hi)
                      FILTER (BOUND(?v) && BOUND(?lo) && BOUND(?hi) && (?v < ?lo || ?v > ?hi))
                  }""" ] ;
          sh:severity sh:Violation .
    severity: E
    message: >-
      Value out of range: "{sentence}" gives {value}, but "{attribute}" of "{class}" ranges from {min} to {max}.
    hint: "Use a value within the range of the class, or change the range."
    tests: []
    note: "Figure 27 of the norm violates this rule itself (N-029)."

