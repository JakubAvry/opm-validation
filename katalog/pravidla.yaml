  - id: OPM-10-050
    iso: 10.3.3.2.2
    page: 52
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: >-
      A sentence about a feature or its value identifies the feature's exhibitor ("Feature of Exhibitor"); the
      exhibitor must actually have that feature, directly or by inheritance.
    check:
      by: shacl
      core: false
      plan: >-
        For every "Feature of Exhibitor" reference: the feature is exhibited by the exhibitor, by one of its
        generals (generalization, transitively) or by its class (classification). SHACL-SPARQL: Core has no
        component for "value of one path is among the values of another path".
      status: implemented
    shape: |
      opms:OPM-10-050 a sh:NodeShape ; opm:rule "OPM-10-050" ; opm:profile "both" ;
          sh:targetSubjectsOf opm:featureOf ;
          sh:sparql [ sh:prefixes opms:prefixes ; sh:message "feature not exhibited by its exhibitor or an ancestor" ;
              sh:select """
                  SELECT $this ?value WHERE {
                      $this opm:featureOf ?value ; opm:featureName ?fname .
                      FILTER NOT EXISTS {
                          ?value (opm:specializes|opm:instanceOf)* ?anc .
                          ?anc opm:hasFeature ?f . ?f opm:featureName ?fname .
                      }
