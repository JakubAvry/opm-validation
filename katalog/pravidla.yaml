  # ---------------------------------------------------------------- 14.2.2.6 Contextual texture of a system

  - id: OPM-14-061
    iso: 14.2.2.6.1.1
    page: 92
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: "The OPD process tree is a directed tree with the SD as root and the other OPDs as nodes."
    check:
      by: shacl
      core: true
      plan: >-
        A tree has no cycle: following the refinement sentences upwards from an OPD (opm:parentOPD, one or more
        steps) reaches an OPD without a parent. That this root is the SD and that every other OPD has exactly one
        parent are OPM-14-066 and OPM-14-062. SHACL Core: a qualified value shape on the path
        sh:oneOrMorePath. Needs OPD paragraphs in the input.
      status: implemented
    shape: |
      opms:OPM-14-061 a sh:NodeShape ; opm:rule "OPM-14-061" ; opm:profile "both" ;
          sh:targetSubjectsOf opm:parentOPD ;
          sh:property [ sh:path [ sh:oneOrMorePath opm:parentOPD ] ;
                        sh:qualifiedValueShape [ sh:property [ sh:path opm:parentOPD ; sh:maxCount 0 ] ] ;
                        sh:qualifiedMinCount 1 ] ;
          sh:severity sh:Violation ; sh:message "OPD is not connected to the root of the OPD tree" .
    severity: E
    message: >-
      OPD "{opd}" is not connected to SD: its refinement sentences form a cycle (each OPD and its parent:
      {path}); the OPD tree has SD as its root.
    hint: "Correct the refinement sentences so that each OPD refines a thing of an OPD closer to SD."
    tests: []
    note: >-
      Checked so that two OPDs that refine each other are reported.

  - id: OPM-14-062
    iso: 14.2.2.6.1.1
    page: 92
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: >-
      Each edge of the OPD tree goes from the parent OPD holding the refineable to the child OPD with its
      refinees: every OPD except the SD refines exactly one thing of exactly one parent OPD.
    check:
      by: shacl
      core: true
      plan: >-
        Every OPD node other than the SD is the target of exactly one refinement edge (sh:inversePath, min/max
        count 1). Needs OPD paragraphs in the input. An OPD that is only named as the parent in a
        refinement sentence and has no paragraph is not reported here but at that sentence, by OPM-14-094.
      status: implemented
    shape: |
      opms:OPM-14-062 a sh:NodeShape ; opm:rule "OPM-14-062" ; opm:profile "both" ;
          sh:targetClass opm:OPD ;
          sh:or ( [ sh:property [ sh:path opm:label ; sh:hasValue "SD" ] ]
                  [ sh:property [ sh:path opm:parentOPD ; sh:minCount 1 ; sh:maxCount 1 ] ]
                  [ sh:property [ sh:path [ sh:inversePath opm:heads ] ; sh:maxCount 0 ] ] ) ;
          sh:severity sh:Violation ; sh:message "OPD without exactly one parent OPD" .
    severity: E
    message: "OPD \"{opd}\" {problem}: every OPD except SD refines exactly one thing of one parent OPD."
    hint: "Add the refinement sentence (\"SD is refined by in-zooming <Process> in {opd}.\") or remove the extra one."
    tests: []

  - id: OPM-14-094
    iso: 14.2.2.6.1.1
    page: 92
    strength: shall
    covers: 0
    source: ISO
    category: 2
    rule: >-
      The parent OPD of an edge of the OPD tree contains the refineable: the thing that a child OPD refines
      appears in the parent OPD that the refinement sentence names.
    check:
      by: shacl
      core: false
      plan: >-
        For every refinement edge with its sentence (opm:Refinement: "SD is refined by in-zooming P in SD1." and
        the new-diagram forms of in-zooming and unfolding): the refined thing is shown in the parent OPD
        (opm:shownIn) by another sentence; a parent OPD without a paragraph shows nothing. SHACL-SPARQL: the
        thing and the OPD of two paths are compared. Needs OPD paragraphs in the input.
      status: implemented
    shape: |
      opms:OPM-14-094 a sh:NodeShape ; opm:rule "OPM-14-094" ; opm:profile "both" ;
          sh:targetClass opm:Refinement ;
          sh:sparql [ sh:prefixes opms:prefixes ; sh:message "refined thing is not in the parent OPD" ;
              sh:select """
                  SELECT $this ?value WHERE {
                      $this opm:parent ?value ; opm:refines ?t .
                      FILTER NOT EXISTS { ?t opm:shownIn ?value }
                  }""" ] ;
          sh:severity sh:Violation .
    severity: E
    message: "\"{sentence}\": {problem}; the parent OPD of a refinement contains the refined thing."
    hint: "Name the OPD in which \"{thing}\" appears, or describe \"{thing}\" in {parent}."
    tests: []
    note: >-
      The second checkable part of the sentence that OPM-14-062 covers (covers 0 here): a refinement of a process that the parent OPD does not contain, and a parent OPD
      missing from the text, reported at the refinement sentence.

