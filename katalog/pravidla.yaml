  - id: OPM-B-007
    iso: B
    page: 116
    strength: should
    covers: 2
    source: ISO
    category: 1
    rule: >-
      A process name should end with a gerund (-ing) and have no more than four capitalised words (B.6.3).
    check:
      by: shacl
      core: true
      plan: "sh:pattern on the names of processes: last word ends in -ing, at most four words."
      status: implemented
    shape: |
      opms:OPM-B-007 a sh:NodeShape ; opm:rule "OPM-B-007" ; opm:profile "both" ;
          sh:targetClass opm:Process ;
          sh:property [ sh:severity sh:Warning ; sh:path opm:name ; sh:pattern "^(?:\\S+\\s+){0,3}\\S*ing(?:\\s+of\\s+.+)?$" ] ;
          sh:severity sh:Warning ; sh:message "process name does not end in -ing or has more than four words" .
      # An operation named after its exhibitor ("Heating of Kettle", 10.3.3.2.2) is checked on its own name.
    severity: W
    message: "Process name \"{name}\" {problem}; process names end with a verb in -ing and have at most four words."
    hint: "E.g. \"Large City Population Securing\"."
    tests: []

  - id: OPM-B-008
    iso: B
    page: 116
    strength: should
    covers: 2
    source: ISO
    category: 1
    rule: "State names should describe situations, preferably as passive forms (painted), not gerunds (painting) (B.6.4)."
    check:
      by: shacl
      core: false
      plan: >-
        SPARQL: a state name ending in -ing that is a word of a process name in the model, i.e. the gerund of a
        process (B.6.4 EXAMPLE: state painting next to the process Painting). An -ing adjective that names no
        process (pending, existing, missing, boiling) describes a situation and is not reported. SHACL Core cannot
        compare the name of the state with the names of other nodes (the processes).
      status: implemented
    shape: |
      opms:OPM-B-008 a sh:NodeShape ; opm:rule "OPM-B-008" ; opm:profile "both" ;
          sh:targetClass opm:State ;
          sh:sparql [ sh:prefixes opms:prefixes ; sh:message "state named with the gerund of a process" ;
              sh:select """
                  SELECT DISTINCT $this ?value WHERE {
                      $this opm:name ?value .
                      FILTER (REGEX(?value, "ing$"))
                      ?p a opm:Process ; opm:name ?pn .
                      FILTER (CONTAINS(CONCAT(" ", LCASE(?pn), " "), CONCAT(" ", LCASE(?value), " ")))
                  }""" ] ;
          sh:severity sh:Warning .
    severity: W
    message: >-
      State "{state}" of "{object}" is the gerund of a process name; states should be situations such as
      "painted".
    hint: "Use the passive form, e.g. \"painted\" instead of \"painting\"."
    tests: []
    note: >-
      Reporting every state name ending in -ing gave 3 false findings on the references
      (pending, conflicting, existing: adjectives that describe situations), and an independent test gave one
      more (missing). The norm's concern is the gerund of the process that changes the object (B.6.4 EXAMPLE), so
      only that is reported; an -ing state that names no process is missed (a should rule, reported as W).

# Defects found in the norm itself while building the catalogue. Reported, not silently fixed.
# verified: where it was checked (the PDF, not only the extracted text).
findings:

  - id: N-001
    iso: 9.1.1, Figure 7
    page: 22
    verified: PDF
    severity: medium
    what: >-
      The captions of Figure 7 do not match the diagrams and sentences: a) is labelled Result but shows a
      consumption ("Deleting consumes File"), b) is labelled Effect but shows a result ("Creating yields File"),
      c) is labelled Consumption but shows an effect ("Editing affects File").

  - id: N-002
    iso: 9.1.3, EXAMPLE 2
    page: 23
    verified: PDF
    severity: low
    what: >-
      The example computes the output of Refining and ends with "8,000 cubic meters of Crude Oil"; by the rest
      of the example it should be Diesel Oil (Crude Oil is the consumee).

  - id: N-003
    iso: 9.1.1, Figure 7
    page: 22
    verified: PDF
    severity: low
    what: >-
      The OPL sentences under Figure 7 have no final full stop, which Annex A requires for every OPL sentence;
      Table 1 (9.1.5) writes them with it.

  - id: N-004
    iso: Annex A.4.3, "object with optional state"
    page: 101
    verified: PDF
    severity: medium
    what: >-
      The production puts a mandatory space between the optional state and the object identifier. Without a
      state, a literal reading gives a double space (e.g. "Eating consumes  Food"). The grammar implementation
      has to treat the space as part of the optional state.

  - id: N-005
    iso: Annex A.4.5.2.2-4, Xor sentences with several processes
    page: 102
    verified: PDF
    severity: medium
    what: >-
      "Exactly " followed by "process Xor list at beginning", which starts with "One of ", yields
      "Exactly One of ..." with a capital O in the middle of the sentence (consumption destination Xor, result
      source Xor, effect process Xor, agent source Xor, instrument destination Xor).

  - id: N-006
    iso: Annex A.4.3, "object nostates Xor list at end"
    page: 101
    verified: PDF
    severity: medium
    what: >-
      The production is named "nostates" but is defined with "object Or list" (objects with optional states)
      instead of "object Or list nostates". Used by the effect Xor sentence, where states are not allowed.

  - id: N-007
    iso: Annex A.4.5.2.4
    page: 103
    verified: PDF
    severity: low
    what: >-
      The effect object Or sentence refers to "object Or list Nostates" (capital N), which is not defined
      (the list is "object Or list nostates"). The cross-reference comment of the effect sentence says
      "see 9.14" instead of 9.1.4.

  - id: N-008
    iso: 9.1.2, 9.1.3 versus Annex A and clause 11
    page: 22
    verified: text search of Annex A and clause 11
    severity: medium
    what: >-
      The body requires a rate property on consumption and result links that model transformation over time,
      but Annex A defines no OPL sentence for link properties such as a rate. These requirements are therefore
      not visible in OPL text.

  - id: N-009
    iso: 9.1.4 versus Table 1
    page: 23
    verified: PDF
    severity: low
    what: >-
      9.1.4 defines the effect as an unspecified change; Table 1 describes it as a change from one state to
      another. Read together with 9.1.4, the catalogue does not require states for an affectee.

  - id: N-010
    iso: 9.3.2, Figure 10, versus Annex A.4.4.4
    page: 27
    verified: PDF
    severity: high
    what: >-
      Annex A joins the last state of a state enumeration with "and" ("A can be s1, s2 and s3"), but every
      example in the body joins it with "or" ("A can be s1, s2, or s3.", "Raw Metal Bar can be pre-cut or cut.",
      "Moving Truck can be worn out or serviced."), as OPCloud does; chapter 10 mixes both ("Gender of Adult can
      be female or male." in Figure 26, "... can be ground, air, and water surface." in Figures 25 and 28). Figure 10 also writes "S2 is initial.",
      a form Annex A does not define (it has "State s2 of A is initial."). The state declaration is one of the
      most frequent OPL sentences, so the ISO profile has to decide which form it accepts.

  - id: N-011
    iso: 9.3.3.2, Figure 11
    page: 28
    verified: PDF
    severity: medium
    what: >-
      The diagram of Figure 11 draws the consumption of Raw Metal Bar from its state cut, and the text says
      Machining consumes it only in that state, but the OPL under the figure says "Machining consumes Raw Metal
      Bar." without the state. The environmental process Cutting (dashed) has no OPL sentence declaring it
      environmental, while Testing has one.

  - id: N-012
    iso: Figures 11 and 12 versus Annex A.4.4.2
    page: 28
    verified: PDF
    severity: medium
    what: >-
      The examples write generic properties as "Raw Metal Bar is physical." and "Testing is environmental and
      physical." (Figures 11, 12), Figure 4 as "Physical Systemic Object is a physical and systemic object.". Annex A defines the values with capitals ("Physical", "Environmental"), in the order essence,
      affiliation, perseverance, and with no separator between them, so a literal reading gives
      "Testing is PhysicalEnvironmental".

  - id: N-013
    iso: 9.3.3.4
    page: 29
    verified: PDF
    severity: low
    what: >-
      In the clause on the output-specified effect link, the syntax sentence is introduced as "the syntax of an
      input-specified effect link"; the form given ("changes Object to output-state") is the output-specified one.

  - id: N-014
    iso: Annex A.4.2 versus 9.4.2, Tables 3, 7, 13
    page: 100
    verified: PDF (examples), text (grammar line)
    severity: medium
    what: >-
      Annex A defines a state identifier as a single non-capitalised word, but the body uses multi-word states:
      "worn out", "old apartment", "awaiting test", "passed test", "safety design authorized", "periodically
      calibrated". The examples also capitalise a state that starts a sentence ("Sober Pilot handles Flying.",
      "Awaiting test Sample initiates Testing, ..."), as the NOTE in 9.4.1 prescribes, which a non-capitalised
      identifier cannot produce. Attribute values such as 75 (7.3.5.5) are states too, but a number is hardly a
      "non capitalized word". A parser that follows Annex A literally rejects the norm's own examples.

  - id: N-015
    iso: Annex A.4.5.3.2, agent sentence
    page: 105
    verified: PDF
    severity: high
    what: >-
      The basic agent sentence of Annex A uses the verb "handle" (object with optional state list, " handle ",
      process identifier), which gives "Welder handle Welding". The body (9.2.2) and all examples write
      "handles". The plural form would fit a list of agents, but the production does not distinguish one agent
      from several.

  - id: N-016
    iso: Annex A.4.5.3.2, agent Or sentences
    page: 105
    verified: PDF
    severity: medium
    what: >-
      The agent source Or sentence has "handles" without spaces ("... object Or list, "handles", process ..."),
      giving "...or Bobhandles Welding"; the agent destination Or sentence has "handles at least one of " without
      the leading space.

  - id: N-017
    iso: Annex A.4.5.4.3 versus 9.5.3.2.1
    page: 107
    verified: PDF
    severity: high
    what: >-
      In Annex A the conditional agent sentence and the conditional instrument sentence are the same production
      ("<Process> occurs if <Object> exists, else <Process> is skipped"), so from OPL text an agent condition
      cannot be told from an instrument condition. The body gives the agent its own form ("<Agent> handles
      <Process> if <Agent> exists, else <Process> is skipped").

  - id: N-018
    iso: 9.5.3, Tables 10, 11, 13, Figure 13, Annex A.4.5.4.3
    page: 37
    verified: PDF
    severity: high
    what: >-
      The wording of condition sentences differs between the body, the tables and Annex A.
      Consumption: body "in which case Object is consumed", Table 10 "in which case Process consumes Object".
      Agent and instrument: body "else", Tables 11 and 13 and Figure 13 "otherwise"; Table 11 "if Engineer is
      present" instead of "exists". State-specified effects: body "occurs if Object is input-state", Annex A
      "occurs if there is input-state Object" and "else" instead of "otherwise". The second forms of the
      state-specified effect and instrument sentences ("If input-state Object then ...") lack the "exists" that
      the consumption form has, and the effect forms also drop "occurs and". The Annex A alternatives of the
      output-specified effect and of the state-specified instrument condition differ from the body forms as
      well ("... in which case P changes O to s, otherwise bypass P"; "P occurs if s I exists, else ...").

  - id: N-019
    iso: Annex A.4.5.4 (event, condition, invocation sentences)
    page: 106
    verified: PDF
    severity: medium
    what: >-
      Literal reading of the control productions gives malformed strings: "occurs if " and "occurs and
      affects " without the leading space (simple conditional effect sentence); "is skipped " with a space
      before the full stop; "input state, object identifier" without a space between state and object (effect
      event and conditional sentences); "invokes at least one of" without the trailing space; "invokes itself "
      with a trailing space; no concatenation comma before "object with optional state" in the instrument event
      sentence; "Input state" capitalised (undefined); no comma before "in which case" in the input specified
      conditional effect sentence. The invocation Xor sentence writes "Exactly one of" in lower case, unlike
      the other Xor sentences (N-005). The conditional effect sentence lists the alternative "output specified
      condition effect sentence", which is not defined (the production is "output specified conditional effect
      sentence"). In the conditional consumption sentences the literal "is consumed, otherwise" is broken across
      two lines inside the quotes, so a literal transcription contains a line break and indentation.

  - id: N-020
    iso: Annex A.4.5.2.5, change sentences
    page: 103
    verified: text (Annex A extract)
    severity: low
    what: >-
      Production names do not match their uses: "in out specified change Object Xor sentence" is defined with a
      capital O but referred to as "... object Xor sentence"; "Or In out object change list" versus "Or in out
      object change list". The output object change list misses the concatenation comma (", " output object
      change phrase). In the output specified change Or sentence the alternative with several processes takes a
      whole output object change list, where the in-out and input analogues take a single change phrase.

  - id: N-021
    iso: 9.5.2.3.4, Table 7
    page: 35
    verified: PDF
    severity: medium
    what: >-
      The output-specified effect event link starts from the object in any state ("Object in any state initiates
      ..."), but the example in Table 7 draws the event from the state rusty and writes "Rusty Engine Hood
      initiates Cleaning & Painting which changes Engine Hood to painted" (a specified state, no comma, no full
      stop).

  - id: N-022
    iso: 9.5.3.4.3, Table 13
    page: 44
    verified: PDF
    severity: low
    what: >-
      One example names the same things twice differently: the diagram has "LASER Metre", the OPL "LASER Meter";
      the OPL calls the process "Ultra-Precision Measuring" and, in the same sentence, "Ultra-Precise Measuring".

  - id: N-023
    iso: 9.3.2, NOTE 2 versus Figure 10
    page: 26
    verified: PDF (figure), text (note)
    severity: low
    what: >-
      The rule on result links to an initial state is only a recommendation ("should") and NOTE 2 says the
      modeller can want the right-hand OPL, yet Figure 10 labels that variant "Incorrect"; 7.3.5.3 defines the
      initial state as the state upon generation, which makes a result link to it natural. The catalogue keeps
      the weaker reading (warning W, OPM-9-051).

  - id: N-024
    iso: 9.5.3.3.5, Table 12
    page: 43
    verified: text
    severity: medium
    what: >-
      For the condition output-specified effect link, the semantics column of Table 12 says the process changes
      the object from its input state to any one of its states, while 9.5.3.3.4 and the sample sentence of the
      same row say it changes the object to the specified output state.

  - id: N-025
    iso: Annex A.4.5.2.5, change Or / Xor sentences with several processes
    page: 103
    verified: text (Annex A extract)
    severity: medium
    what: >-
      The change select sentences with several processes have no "At least one of " (Or) and no "Exactly " (Xor)
      prefix ("process Or list, " changes ", ..."; "process Xor list at beginning, " changes ", ..."), unlike
      the consumption, result, effect and instrument select sentences, so the Or and Xor variants read alike
      apart from "One of".

  - id: N-026
    iso: 9.3.3.3
    page: 28
    verified: PDF
    severity: low
    what: >-
      "Existence of the affectee at the input source state is a precondition ..." is stated without "shall",
      unlike the parallel sentences of 9.3.3.2 and 9.3.3.4. Requirements can therefore be phrased without the
      modal verb; the catalogue records this one as OPM-9-169 (strength implicit), outside the shall count.

  - id: N-027
    iso: chapter 9, editorial
    page: 25
    verified: text
    severity: low
    what: >-
      Editorial slips that do not change a rule: "preforming the Sintering process" for performing (9.2.3,
      EXAMPLE 2); "default state. then" with a stray full stop (9.3.3.3); Figure 11 captioned "results links"
      and placed in the effect-link clause; "initiates process" for initiated process in Table 7; a stray
      closing quotation mark after the syntax of 9.5.2.4.2; "shall be: either" with a misplaced colon
      (9.5.3.3.4); circular graphical definitions in 9.5.3.3.2-9.5.3.3.4 ("the condition ... link with the
      letter c shall denote the condition ... link").

