  # ---------------------------------------------------------------- requirements stated without "shall"

  - id: OPM-11-023
    iso: "11.1"
    page: 65
    strength: implicit
    covers: 0
    source: ISO
    category: 2
    rule: "In a multiplicity range qmin..qmax the lower bound does not exceed the upper bound."
    check:
      by: shacl
      core: true
      plan: >-
        The converter makes a node for every range of a multiplicity whose two bounds are numbers (opm:Range with
        opm:lower and opm:upper; bounds given as parameters are left out). SHACL Core: sh:lessThanOrEquals.
      status: implemented
    shape: |
      opms:OPM-11-023 a sh:NodeShape ; opm:rule "OPM-11-023" ; opm:profile "both" ;
          sh:targetClass opm:Range ;
          sh:property [ sh:path opm:lower ; sh:lessThanOrEquals opm:upper ] ;
          sh:severity sh:Warning ; sh:message "lower bound of a range exceeds its upper bound" .
    severity: W
    message: "Range \"{range}\" in \"{sentence}\": the lower bound exceeds the upper bound."
    hint: "Write the lower bound first."
    tests: []
    note: >-
      Not stated with a modal verb: a consequence of the definition of a range (OPM-11-006), so
      reported as W.

