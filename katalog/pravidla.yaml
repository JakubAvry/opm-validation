  - id: OPM-14-068
    iso: 14.2.2.6.1.3
    page: 92
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: >-
      The SD contains one and only one systemic process, the overarching system function; environmental
      processes may be added.
    check:
      by: shacl
      core: true
      plan: >-
        On the SD node: exactly one process that appears in the SD and is systemic (affiliation systemic is the
        default, 7.3.4). In a flat model without paragraphs the whole model counts as SD only if it has no in-zoom.
        SHACL Core: qualified count 1..1 of the things shown in the SD.
      status: implemented
    shape: |
      opms:OPM-14-068 a sh:NodeShape ; opm:rule "OPM-14-068" ; opm:profile "both" ;
          sh:targetClass opm:OPD ;
          sh:or (
              [ sh:not [ sh:property [ sh:path opm:label ; sh:hasValue "SD" ] ] ]
              [ sh:property [ sh:path [ sh:inversePath opm:shownIn ] ;
                              sh:qualifiedValueShape [ sh:class opm:Process ;
                                                       sh:property [ sh:path opm:affiliation ; sh:hasValue "systemic" ] ;
                                                       sh:not [ sh:class opm:Object ] ] ;
                              sh:qualifiedMinCount 1 ; sh:qualifiedMaxCount 1 ] ]
          ) ;
          sh:severity sh:Violation ; sh:message "SD does not have exactly one systemic process" .
    severity: E
    message: "SD contains {n} systemic processes ({list}); it must contain exactly one, the system function."
    hint: >-
      Keep the main function in SD and move the others into its refinement, or declare them environmental
      ("<Process> is environmental.").
    tests: []

  - id: OPM-14-069
    iso: 14.2.2.6.1.4
    page: 93
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: "Each edge label of the OPD tree refers to the refinement of a uniquely named process into another OPD."
    check:
      by: shacl
      core: false
      plan: >-
        The refinement sentence "<Parent> is refined by in-zooming <Process> in <Child>." is the edge label: when
        the paragraph of the child OPD has in-zoom sentences, one of them in-zooms that process. (A child
        paragraph without any in-zoom sentence is not reported.) SHACL-SPARQL: the process of the sentence is
        compared with the processes of the in-zooms of the child OPD. Needs OPD paragraphs.
      status: implemented
    shape: |
      opms:OPM-14-069 a sh:NodeShape ; opm:rule "OPM-14-069" ; opm:profile "both" ;
          sh:targetClass opm:Refinement ;
          sh:sparql [ sh:prefixes opms:prefixes ; sh:message "child OPD in-zooms another process than the edge label says" ;
              sh:select """
                  SELECT DISTINCT $this ?value WHERE {
                      $this opm:kind "in-zooming" ; opm:child ?d ; opm:refines ?t .
                      ?z a opm:InZoom ; opm:childOPD ?d ; opm:refines ?value .
                      FILTER NOT EXISTS { ?z2 a opm:InZoom ; opm:childOPD ?d ; opm:refines ?t }
                  }""" ] ;
          sh:severity sh:Violation .
    severity: E
    message: >-
      "{sentence}" says that {child} in-zooms "{thing}", but the paragraph {child} in-zooms "{zoomed}".
    hint: "Name the process that {child} in-zooms, or put the zoom sentence of \"{thing}\" into {child}."
    tests: []

