  - id: OPC-002
    iso: "-"
    page: null
    strength: shall
    covers: 0
    source: OPCloud
    category: 2
    rule: "A physical subprocess cannot be inside an informatical in-zoomed process (OPCloud)."
    check:
      by: shacl
      core: true
      plan: >-
        No physical process is a subprocess of an informatical process: a subprocess is not physical, or none of
        its in-zoomed processes is informatical (SHACL Core, sh:or). Active only in
        the OPCloud profile.
      status: implemented
    shape: |
      opms:OPC-002 a sh:NodeShape ; opm:rule "OPC-002" ; opm:profile "opcloud" ;
          sh:targetSubjectsOf opm:subprocessOf ;
          sh:or (
              [ sh:not [ sh:property [ sh:path opm:essence ; sh:hasValue "physical" ] ] ]
              [ sh:property [ sh:path opm:subprocessOf ;
                              sh:not [ sh:property [ sh:path opm:essence ; sh:hasValue "informatical" ] ] ] ]
          ) ;
          sh:severity sh:Violation ; sh:message "physical subprocess inside an informatical process (OPCloud)" .
    severity: E
    message: "\"{subprocess}\" is physical but its in-zoomed process \"{process}\" is informatical (OPCloud)."
    hint: "Make \"{process}\" physical or \"{subprocess}\" informatical."
    tests: []
    note: "Verified in OPCloud."

  - id: OPC-003
    iso: "-"
    page: null
    strength: shall
    covers: 0
    source: OPCloud
    category: 1
    rule: >-
      The OPCloud sentence "State <s> is initial." (without "of <Object>") marks a state of the object of the
      preceding state sentence; without such a sentence the mark has no object.
    check:
      by: grammar
      production: "opc_state_mark; the converter takes the object from the preceding state sentence"
      status: implemented
    severity: W
    message: "\"{sentence}\": {detail}; the state mark is ignored."
    hint: >-
