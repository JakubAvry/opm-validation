  - id: OPM-12-002
    iso: "12.1"
    page: 69
    strength: shall
    covers: 1
    source: ISO
    category: 1
    rule: >-
      Links with AND semantics are written as one OPL sentence joining the things with "and", not as one
      sentence per link.
    check:
      by: shacl
      core: false
      plan: >-
        A procedural link (consumption, result, effect, change, agent, instrument) whose sentence comes after
        another sentence with a link of the same kind and sentence form at the same process, in the same OPD and
        under the same path label; changes are compared only within one form (from-to, only from, only to: the
        three lists of A.4.5.2.5 cannot be joined); links with an event or condition and members of fans are left out (they have
        their own sentence forms), and a sentence repeated word for word is not a split.
      status: implemented
    shape: |
      opms:OPM-12-002 a sh:NodeShape ; opm:rule "OPM-12-002" ; opm:profile "both" ;
          sh:targetClass opm:ProceduralLink ;
          sh:sparql [ sh:prefixes opms:prefixes ; sh:message "links with AND semantics in separate sentences" ;
              sh:select """
                  SELECT $this ?value WHERE {
                      $this a ?cls ; opm:process ?p ; opm:sentence ?s .
                      FILTER(?cls IN (opm:ConsumptionLink, opm:ResultLink, opm:EffectLink, opm:AgentLink, opm:InstrumentLink))
                      ?value a ?cls ; opm:process ?p ; opm:sentence ?s0 .
                      ?s opm:line ?l ; opm:column ?c ; opm:text ?t .
                      ?s0 opm:line ?l0 ; opm:column ?c0 ; opm:text ?t0 .
                      FILTER(?l0 < ?l || (?l0 = ?l && ?c0 < ?c))
                      FILTER(?t0 != ?t)
                      BIND(EXISTS { $this a opm:ChangeLink } AS ?change)
                      BIND(EXISTS { ?value a opm:ChangeLink } AS ?change0)
                      FILTER(?change = ?change0)
                      BIND(EXISTS { $this opm:fromState ?fs } AS ?from)
                      BIND(EXISTS { ?value opm:fromState ?fs0 } AS ?from0)
                      BIND(EXISTS { $this opm:toState ?ts } AS ?to)
                      BIND(EXISTS { ?value opm:toState ?ts0 } AS ?to0)
                      FILTER(?from = ?from0 && ?to = ?to0)
                      OPTIONAL { $this opm:modifier ?m }
                      OPTIONAL { ?value opm:modifier ?m0 }
                      FILTER(!BOUND(?m) && !BOUND(?m0))
                      OPTIONAL { ?f opm:member $this }
                      OPTIONAL { ?f0 opm:member ?value }
                      FILTER(!BOUND(?f) && !BOUND(?f0))
                      OPTIONAL { $this opm:inOPD ?d }
                      OPTIONAL { ?value opm:inOPD ?d0 }
                      FILTER((!BOUND(?d) && !BOUND(?d0)) || ?d = ?d0)
                      OPTIONAL { $this opm:pathLabel ?pl }
                      OPTIONAL { ?value opm:pathLabel ?pl0 }
                      FILTER((!BOUND(?pl) && !BOUND(?pl0)) || ?pl = ?pl0)
                  }""" ] ;
          sh:severity sh:Violation .
    severity: E
    severity_iso: I
    message: >-
      Links with AND semantics belong in one sentence: "{sentence}" and the sentence on line {line0} ("{sentence0}")
      both give {verb} links of "{process}".
    message_iso: >-
      Links with AND semantics in separate sentences: "{sentence}" and the sentence on line {line0} ("{sentence0}")
      both give {verb} links of "{process}". Clause 12.1 asks for one sentence with "and"; the examples of the
      norm (Figures 11, 33, 47) write separate sentences too (N-062).
    hint: "Join them into one sentence with \"and\": \"{joined}\" (more things: \"A, B, and C\")."
    tests: []
    note: >-
      A grammar cannot see across sentences, so this is a SHACL shape over the links of the RDF (the sentence of
      each link is in the data). Only sentences of the same form are compared: "P affects A." and "P changes B from
      s1 to s2." cannot be joined. Path labels (clause 13) keep links apart. The OPCloud references join such links
      (no finding on case6-25).
      In the ISO profile the entry is reported as I, not E:
      Figures 11, 33 and 47 of the norm write links of one kind at one process in separate sentences (N-062).
      In the OPCloud profile it stays E: OPCloud always joins them.

