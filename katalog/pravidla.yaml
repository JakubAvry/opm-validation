# Catalogue of ISO 19450:2024(en) rules for validating OPL.
# Single source: SHACL shapes, the coverage table and the test list are generated from this file.
# Paraphrases only; no longer verbatim passages of the norm (ISO is copyrighted). Grammar productions are named,
# not copied.
#
# Fields
#   id        OPM-<chapter>-<number>; stable, independent of ISO clause numbering
#   iso       clause of ISO 19450:2024(en)
#   page      printed page number (PDF page = printed + 8; iso/sNNN.txt = printed + 6)
#   strength  shall | should | implicit (a requirement stated without the modal verb; covers 0)
#   covers    how many "shall"/"should" words of the clause this entry accounts for (coverage check, pokryti.py)
#   source    ISO | OPCloud
#   category  1 syntax (grammar, Annex A)       2 static structure / semantics (SHACL)
#             3 OPD graphics (n/a to OPL text)   4 runtime behaviour (not statically checkable)
#             5 definition / permission (not a rule)
#   rule      English paraphrase of the requirement
#   check     by: grammar | shacl | none; core: true if SHACL Core suffices; production (grammar) or plan (shacl);
#             reason (none); needs: data the OPL text does not contain; status: planned | implemented
#             (status is set by katalog/tvary.py: SHACL = own shape, or all shared shapes of the plan exist;
#             grammar = a test shows it: testy/vety_platne.txt names it, or testy/vety_neplatne.txt expects it)
#   shape     the SHACL shape in Turtle (opm:rule = id); katalog/tvary.py --write generates opmvalid/tvary.ttl
#   severity  E (shall) | W (should) | I (dialect difference); null when nothing is checked
#             severity_iso / severity_opcloud (optional): the severity in that profile, when it differs; with it
#             message_iso / message_opcloud, the report text in that profile (contradictions inside
#             the norm: the ISO profile accepts every normative version and reports the one a sentence does not follow as I)
#   message   report text; placeholders in braces are filled by the validator
#   hint      how to fix
#   tests     ids of test cases (filled when tests exist)
#   note      anything a reviewer should know

norm: ISO 19450:2024(en)
scope_done: ["6", "7", "8", "9", "10", "11", "12", "13", "14", "A", "B"]

rules:

  # ---------------------------------------------------------------- 9.1.1 Kinds of transforming links

  - id: OPM-9-001
    iso: 9.1.1
    page: 22
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: >-
      A transforming link connects a process with an object, its transformee: one end is a process,
      the other end is an object.
    check:
      by: shacl
      core: true
      plan: >-
        Target every transforming link (consumption, result, effect and their state-specified variants);
        its process end must be a process and not an object, its object end an object and not a process,
        exactly one of each.
      status: implemented
    shape: |
      opms:OPM-9-001 a sh:NodeShape ; opm:rule "OPM-9-001" ; opm:profile "both" ;
          sh:targetClass opm:TransformingLink ;
          sh:property [ sh:path opm:process ; sh:minCount 1 ; sh:maxCount 1 ; sh:not [ sh:class opm:Object ] ] ;
          sh:property [ sh:path opm:object ; sh:minCount 1 ; sh:maxCount 1 ; sh:not [ sh:class opm:Process ] ] ;
          sh:severity sh:Violation ; sh:message "transforming link must connect a process with an object" .
    severity: E
    message: >-
      Link not possible: "{sentence}" must connect a process with an object, but "{thing}" is a {kind}.
    hint: >-
      If both things are processes, use an invocation link (9.5.2.5); if both are objects, use a structural
      link (clause 10); otherwise swap the sides of the sentence.
    tests: []
    note: >-
      OPL text does not mark kinds explicitly; the kind of a thing follows from its positions in all sentences
      (e.g. the subject of "consumes" is a process). A violation therefore shows as a thing used as an object in
      one sentence and as a process in another. How kinds are derived is part of the RDF model.

  - id: OPM-9-002
    iso: 9.1.1
    page: 22
    strength: shall
    covers: 1
    source: ISO
    category: 1
    rule: >-
      There are exactly three kinds of transforming links: consumption, result and effect (state-specified
      variants in 9.3).
    check:
      by: grammar
      production: "transforming sentence (A.4.5.2.1)"
      status: implemented
    severity: E
    message: >-
      Not a valid OPL sentence: "{sentence}". A transforming sentence uses "consumes", "yields", "affects"
      or "changes".
    hint: >-
      Rewrite the sentence with one of the transforming verbs, or use an enabling link ("handles", "requires").
    tests: []
    note: >-
      Enforced by the grammar: a sentence with any other verb is not a transforming sentence. It could be
      read as a definition (5); kept as syntax because the grammar enforces the closed set.

  - id: OPM-9-003
    iso: 9.1.1
    page: 22
    strength: shall
    covers: 1
    source: ISO
    category: 5
    rule: >-
      Transformee is a role of an object with respect to one process; the same object may have another role
      for another process.
    check:
      by: none
      reason: >-
        Definition. Its checkable consequence, one role per object and process, is the uniqueness principle
        of 8.1.2.
    severity: null
    tests: []

  # ---------------------------------------------------------------- 9.1.2 Consumption link

  - id: OPM-9-004
    iso: 9.1.2
    page: 22
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: >-
      A consumption link is a transforming link: the linked process consumes (destroys, eliminates) the linked
      object, the consumee.
    check:
      by: shacl
      core: true
      plan: "Shared shape of OPM-9-001 (consumption link is a transforming link)."
      status: implemented
    severity: E
    message: "See OPM-9-001."
    tests: []
    note: >-
      Definition; its checkable part is the kind of both ends, checked once by OPM-9-001.

  - id: OPM-9-005
    iso: 9.1.2
    page: 22
    strength: shall
    covers: 1
    source: ISO
    category: 3
    rule: "Graphical symbol of the consumption link (arrow with closed head from consumee to process)."
    check:
      by: none
      reason: "OPD graphics; does not apply to OPL text."
    severity: null
    tests: []

  - id: OPM-9-006
    iso: 9.1.2
    page: 22
    strength: shall
    covers: 1
    source: ISO
    category: 1
    rule: >-
      Consumption sentence: "<Process> consumes <Object>." The object may carry a state (9.3.1); several
      objects are joined with "and" (12.1); Or / Xor forms are in 12.2 and 12.3.
    check:
      by: grammar
      production: "consumption sentence (A.4.5.2.2)"
      status: implemented
    severity: E
    message: >-
      Not a valid consumption sentence: "{sentence}". Expected "<Process> consumes <Object>." ({detail}).
    hint: "The consuming process is the subject; the consumed object follows \"consumes\"."
    tests: []
    note: >-
      OPCloud writes the plain form the same way (verified in the references, testy/reference). Defects of
      the production itself: N-004, N-006.

  - id: OPM-9-007
    iso: 9.1.2
    page: 22
    strength: shall
    covers: 1
    source: ISO
    category: 4
    rule: "Existence of the consumee is (part of) the precondition for activating the process."
    check:
      by: none
      reason: "Runtime semantics (execution control); not visible in a static model."
    severity: null
    tests: []

  - id: OPM-9-008
    iso: 9.1.2
    page: 22
    strength: shall
    covers: 1
    source: ISO
    category: 4
    rule: "If the consumee does not exist, process activation waits until it exists."
    check:
      by: none
      reason: "Runtime semantics (wait semantics, 8.2.3)."
    severity: null
    tests: []

  - id: OPM-9-009
    iso: 9.1.2
    page: 22
    strength: shall
    covers: 1
    source: ISO
    category: 4
    rule: "Consumption happens immediately when the process is activated, unless consumption over time is modelled."
    check:
      by: none
      reason: "Runtime semantics (timing)."
    severity: null
    tests: []

  - id: OPM-9-010
    iso: 9.1.2
    page: 22
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: "When consumption over time is modelled, the consumption link carries a rate property."
    check:
      by: none
      reason: >-
        Not expressible in OPL: Annex A has no sentence for link properties such as a rate (N-008), and the
        rate itself is the only sign that consumption over time is modelled.
    severity: null
    tests: []

  - id: OPM-9-011
    iso: 9.1.2
    page: 22
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: >-
      When consumption over time is modelled, the consumee has an attribute giving the available quantity.
    check:
      by: none
      reason: >-
        The condition (a rate on the link) cannot be written in OPL (N-008). If a later OPL extension or the
        OPCloud profile carries rates, a partial SHACL Core check becomes possible: a consumee of a link with a
        rate must exhibit at least one attribute.
    severity: null
    tests: []

  # ---------------------------------------------------------------- 9.1.3 Result link

  - id: OPM-9-012
    iso: 9.1.3
    page: 23
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: >-
      A result link is a transforming link: the linked process creates (generates, yields) the linked object,
      the resultee.
    check:
      by: shacl
      core: true
      plan: "Shared shape of OPM-9-001."
      status: implemented
    severity: E
    message: "See OPM-9-001."
    tests: []

  - id: OPM-9-013
    iso: 9.1.3
    page: 23
    strength: shall
    covers: 1
    source: ISO
    category: 3
    rule: "Graphical symbol of the result link (arrow with closed head from process to resultee)."
    check:
      by: none
      reason: "OPD graphics; does not apply to OPL text."
    severity: null
    tests: []

  - id: OPM-9-014
    iso: 9.1.3
    page: 23
    strength: shall
    covers: 1
    source: ISO
    category: 1
    rule: >-
      Result sentence: "<Process> yields <Object>." The object may carry a state (9.3.2); several objects are
      joined with "and"; Or / Xor forms in 12.2 and 12.3.
    check:
      by: grammar
      production: "result sentence (A.4.5.2.3)"
      status: implemented
    severity: E
    message: >-
      Not a valid result sentence: "{sentence}". Expected "<Process> yields <Object>." ({detail}).
    hint: "The creating process is the subject; the created object follows \"yields\"."
    tests: []
    note: "OPCloud writes the plain form the same way. Defects of the production: N-004, N-005 (Xor forms)."

  - id: OPM-9-015
    iso: 9.1.3
    page: 23
    strength: shall
    covers: 1
    source: ISO
    category: 4
    rule: "The resultee is created immediately on process completion, unless generation over time is modelled."
    check:
      by: none
      reason: "Runtime semantics (timing)."
    severity: null
    tests: []

  - id: OPM-9-016
    iso: 9.1.3
    page: 23
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: "When generation over time is modelled, the result link carries a rate property."
    check:
      by: none
      reason: "Not expressible in OPL (N-008); see OPM-9-010."
    severity: null
    tests: []

  - id: OPM-9-017
    iso: 9.1.3
    page: 23
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: "When generation over time is modelled, the resultee has an attribute giving the available quantity."
    check:
      by: none
      reason: "Condition not expressible in OPL (N-008); see OPM-9-011."
    severity: null
    tests: []

  # ---------------------------------------------------------------- 9.1.4 Effect link

  - id: OPM-9-018
    iso: 9.1.4
    page: 23
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: >-
      An effect link is a transforming link: the linked process affects the linked object, the affectee,
      changing its state in an unspecified way.
    check:
      by: shacl
      core: true
      plan: "Shared shape of OPM-9-001."
      status: implemented
    severity: E
    message: "See OPM-9-001."
    tests: []
    note: >-
      No rule that the affectee must have declared states: 9.1.4 says "unspecified change", only Table 1
      (informative summary) speaks of a change from one state to another (N-009).

  - id: OPM-9-019
    iso: 9.1.4
    page: 23
    strength: shall
    covers: 1
    source: ISO
    category: 3
    rule: "Graphical symbol of the effect link (bidirectional arrow with two closed heads)."
    check:
      by: none
      reason: "OPD graphics; does not apply to OPL text."
    severity: null
    tests: []

  - id: OPM-9-020
    iso: 9.1.4
    page: 23
    strength: shall
    covers: 1
    source: ISO
    category: 1
    rule: >-
      Effect sentence: "<Process> affects <Object>." No states in the plain form (a state-specified effect is
      a change sentence, 9.3.3); several objects are joined with "and"; Or / Xor forms in 12.2 and 12.3.
    check:
      by: grammar
      production: "effect sentence (A.4.5.2.4)"
      status: implemented
    severity: E
    message: >-
      Not a valid effect sentence: "{sentence}". Expected "<Process> affects <Object>." ({detail}).
    hint: "To name the states, use \"<Process> changes <Object> from <state> to <state>.\""
    tests: []
    note: "OPCloud writes the plain form the same way. Defects of the production: N-005, N-006, N-007."

  # ---------------------------------------------------------------- 9.2.1 Kinds of enabling links

  - id: OPM-9-021
    iso: 9.2.1
    page: 24
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: "An enabling link connects an enabler, which is an object, with the process it enables."
    check:
      by: shacl
      core: true
      plan: >-
        Target every enabling link (agent, instrument, their state-specified, event and condition variants);
        its object end must be an object and not a process, its process end a process and not an object.
      status: implemented
    shape: |
      opms:OPM-9-021 a sh:NodeShape ; opm:rule "OPM-9-021" ; opm:profile "both" ;
          sh:targetClass opm:EnablingLink ;
          sh:property [ sh:path opm:process ; sh:minCount 1 ; sh:maxCount 1 ; sh:not [ sh:class opm:Object ] ] ;
          sh:property [ sh:path opm:object ; sh:minCount 1 ; sh:maxCount 1 ; sh:not [ sh:class opm:Process ] ] ;
          sh:severity sh:Violation ; sh:message "enabling link must connect an object with a process" .
    severity: E
    message: >-
      Link not possible: "{sentence}" must connect an object (the enabler) with a process, but "{thing}" is a
      {kind}.
    hint: >-
      Agents and instruments are objects. To start one process from another, use an invocation link
      ("<Process> invokes <Process>.", 9.5.2.5).
    tests: []

  - id: OPM-9-022
    iso: 9.2.1
    page: 24
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: "An enabler of a process is an object that the process needs in order to occur."
    check:
      by: shacl
      core: true
      plan: "Shared shape of OPM-9-021."
      status: implemented
    severity: E
    message: "See OPM-9-021."
    tests: []

  - id: OPM-9-023
    iso: 9.2.1
    page: 24
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: >-
      An enabler exists, and is in the same state, after the process completes as just before it began: the
      process it enables does not transform it.
    check:
      by: shacl
      core: true
      plan: >-
        Shared shape of OPM-8-004 (an enabling and a transforming link between the same object and process are
        two procedural links).
      status: implemented
    severity: E
    message: >-
      "{object}" cannot both enable and be transformed by "{process}": an enabler is not changed by the process
      it enables.
    hint: >-
      Keep one link: if "{process}" changes "{object}", keep only the transforming link; otherwise keep only
      "handles" or "requires".
    tests: []
    note: >-
      SHACL Core suffices if the RDF model gives every object direct role properties towards processes
      (enabler of, transformee of); otherwise the check needs SHACL-SPARQL. Overlaps the uniqueness
      principle of 8.1.2.

  - id: OPM-9-024
    iso: 9.2.1
    page: 24
    strength: shall
    covers: 1
    source: ISO
    category: 1
    rule: "There are exactly two kinds of enabling links: agent link and instrument link."
    check:
      by: grammar
      production: "enabling sentence (A.4.5.3.1)"
      status: implemented
    severity: E
    message: >-
      Not a valid OPL sentence: "{sentence}". An enabling sentence uses "handles" (agent) or "requires"
      (instrument).
    hint: "Write \"<Agent> handles <Process>.\" or \"<Process> requires <Instrument>.\""
    tests: []
    note: "Could be read as a definition (5); kept as syntax for the same reason as OPM-9-002."

  - id: OPM-9-025
    iso: 9.2.1
    page: 24
    strength: shall
    covers: 1
    source: ISO
    category: 4
    rule: "The enabler is present during the whole performance of the process it enables."
    check:
      by: none
      reason: "Runtime semantics."
    severity: null
    tests: []

  - id: OPM-9-026
    iso: 9.2.1
    page: 24
    strength: shall
    covers: 1
    source: ISO
    category: 4
    rule: "If the enabler ceases to exist during the process, the process ends immediately."
    check:
      by: none
      reason: "Runtime semantics."
    severity: null
    tests: []

  - id: OPM-9-027
    iso: 9.2.1
    page: 24
    strength: should
    covers: 1
    source: ISO
    category: 5
    rule: "Premature ending of a process should be modelled as exception handling (9.5.4)."
    check:
      by: none
      reason: "Modelling advice; OPL does not say whether a process can end prematurely."
    severity: null
    tests: []

  # ---------------------------------------------------------------- 9.2.2 Agent and agent link

  - id: OPM-9-028
    iso: 9.2.2
    page: 24
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: >-
      An agent is a human or a group of humans able to make intelligent decisions, who enables or controls the
      process.
    check:
      by: shacl
      core: true
      plan: >-
        The object end of every agent link (all variants) must be marked as a human. Needs data that OPL does
        not contain (who is a human); active only when the input provides it.
      needs: which objects are humans
      status: implemented
    shape: |
      opms:OPM-9-028 a sh:NodeShape ; opm:rule "OPM-9-028" ; opm:profile "both" ;
          sh:targetClass opm:AgentLink ;
          sh:property [ sh:path ( opm:object opm:isHuman ) ; sh:in ( true ) ] ;
          sh:severity sh:Violation ; sh:message "agent is not a human" .
    severity: E
    message: >-
      "{object}" handles "{process}", but "{object}" is not a human: an agent must be a human or a group of
      humans.
    hint: "If \"{object}\" is a system or a device, write \"{process} requires {object}.\" (instrument link)."
    tests: []
    note: >-
      Knowledge outside OPL. Without the data this entry counts as "static, not
      checkable from OPL alone".

  - id: OPM-9-029
    iso: 9.2.2
    page: 24
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: "An agent link is an enabling link from the agent to the process it enables."
    check:
      by: shacl
      core: true
      plan: "Shared shape of OPM-9-021."
      status: implemented
    severity: E
    message: "See OPM-9-021."
    tests: []

  - id: OPM-9-030
    iso: 9.2.2
    page: 24
    strength: shall
    covers: 1
    source: ISO
    category: 3
    rule: "Graphical symbol of the agent link (line with a filled circle at the process)."
    check:
      by: none
      reason: "OPD graphics; does not apply to OPL text."
    severity: null
    tests: []

  - id: OPM-9-031
    iso: 9.2.2
    page: 24
    strength: shall
    covers: 1
    source: ISO
    category: 1
    rule: >-
      Agent sentence: "<Agent> handles <Process>." The agent may carry a state (9.4.1); Or / Xor forms in 12.3.
    check:
      by: grammar
      production: "agent sentence (A.4.5.3.2)"
      status: implemented
    severity: E
    message: >-
      Not a valid agent sentence: "{sentence}". Expected "<Agent> handles <Process>." ({detail}).
    hint: "The agent is the subject; the process it handles follows \"handles\"."
    tests: []
    note: >-
      OPCloud writes the plain form the same way. Annex A writes the verb as "handle" (N-015) and has spacing
      defects in the Or forms (N-016); the grammar follows the body text here. Figure 47 writes one agent
      sentence for several processes ("Payer handles P1 and P2.", N-061): read as one agent link per process
      (grammar rule fig_agent_procs) and reported as I in the ISO profile.

  # ---------------------------------------------------------------- 9.2.3 Instrument and instrument link

  - id: OPM-9-032
    iso: 9.2.3
    page: 24
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: >-
      An instrument is an inanimate or otherwise non-decision-making enabler; the process cannot start or run
      without it.
    check:
      by: shacl
      core: true
      plan: >-
        The object end of every instrument link (all variants) must not be marked as a human. Needs the same
        outside data as OPM-9-028.
      needs: which objects are humans
      status: implemented
    shape: |
      opms:OPM-9-032 a sh:NodeShape ; opm:rule "OPM-9-032" ; opm:profile "both" ;
          sh:targetClass opm:InstrumentLink ;
          sh:property [ sh:path ( opm:object opm:isHuman ) ; sh:in ( false ) ] ;
          sh:severity sh:Violation ; sh:message "instrument is a human" .
    severity: E
    message: >-
      "{process}" requires "{object}", but "{object}" is a human: an instrument is a non-decision-making enabler.
    hint: "If \"{object}\" is a person or a group of people, write \"{object} handles {process}.\" (agent link)."
    tests: []
    note: "Knowledge outside OPL."

  - id: OPM-9-033
    iso: 9.2.3
    page: 25
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: "An instrument link is an enabling link from the instrument to the process it enables."
    check:
      by: shacl
      core: true
      plan: "Shared shape of OPM-9-021."
      status: implemented
    severity: E
    message: "See OPM-9-021."
    tests: []

  - id: OPM-9-034
    iso: 9.2.3
    page: 25
    strength: shall
    covers: 1
    source: ISO
    category: 3
    rule: "Graphical symbol of the instrument link (line with an empty circle at the process)."
    check:
      by: none
      reason: "OPD graphics; does not apply to OPL text."
    severity: null
    tests: []

  - id: OPM-9-035
    iso: 9.2.3
    page: 25
    strength: shall
    covers: 1
    source: ISO
    category: 1
    rule: >-
      Instrument sentence: "<Process> requires <Instrument>." The instrument may carry a state (9.4.2); Or / Xor
      forms in 12.3.
    check:
      by: grammar
      production: "instrument sentence (A.4.5.3.3)"
      status: implemented
    severity: E
    message: >-
      Not a valid instrument sentence: "{sentence}". Expected "<Process> requires <Instrument>." ({detail}).
    hint: "The process is the subject; the instrument follows \"requires\"."
    tests: []
    note: "OPCloud writes the plain form the same way."

  # ---------------------------------------------------------------- 9.3.1 State-specified consumption link

  - id: OPM-9-036
    iso: 9.3.1
    page: 26
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: >-
      A state-specified consumption link goes from a specified state of the consumee to the process; the state
      is a state of that object.
    check:
      by: shacl
      core: false
      plan: >-
        Also targeted: a state that a sentence marks initial, final or default
        (opm:markSentence; 7.3.5.1: a stateful object has a specified set of states) and the value that "Attribute
        of X is v." gives to an attribute whose values X inherits (opm:valueSentence).
        Target every state used by a link (all state-specified, event and condition variants, input and output
        states of changes); it must be a declared state of the object at the other end of that link, or, for an
        attribute, a declared value of the same attribute of a general or class (10.3.4.2 and its NOTE, 10.3.5.1).
        Inheritance needs SHACL-SPARQL (the names of the attribute and the value are compared).
      status: implemented
    shape: |
      opms:OPM-9-036 a sh:NodeShape ; opm:rule "OPM-9-036" ; opm:profile "both" ;
          sh:targetObjectsOf opm:state, opm:fromState, opm:toState, opm:sourceState, opm:targetState ;
          sh:targetSubjectsOf opm:markSentence, opm:valueSentence ;
          sh:sparql [ sh:prefixes opms:prefixes ; sh:message "state is not a declared state of its object" ;
              sh:select """
                  SELECT $this WHERE {
                      $this a opm:State .
                      FILTER NOT EXISTS { $this opm:declared true }
                      FILTER NOT EXISTS {
                          $this opm:stateOf ?f ; opm:name ?n . ?f opm:featureOf ?o ; opm:featureName ?fn .
                          ?o (opm:specializes|opm:instanceOf)+ ?anc .
                          ?af opm:featureOf ?anc ; opm:featureName ?fn . ?as opm:stateOf ?af ; opm:name ?n ; opm:declared true .
                      }
                  }""" ] ;
          sh:severity sh:Violation .
      # A specialization or instance inherits the possible values of an attribute, not the states of the object itself.
    severity: E
    message: >-
      State not possible: "{sentence}" uses the state "{state}", which is not a declared state of "{object}".
    hint: >-
      Declare it ("{object} can be ... or {state}.") or use one of the declared states of "{object}": {states}.
    tests: []
    note: >-
      Shared by all state-specified links of 9.3, 9.4 and 9.5, and by attribute values and state-specified
      structural links of chapter 10. Declared states include those of 14.2.1.1 (union over all
      OPDs) and, for attributes, values inherited from a general or class (10.3.4.2, 10.3.5.1); following
      inheritance may need SHACL-SPARQL. A numeric value of an
      attribute with a declared range ("ranges from 120 to 240") must lie within it (7.3.5.5): SHACL Core only if the converter puts the bounds on the value node, otherwise SHACL-SPARQL.

