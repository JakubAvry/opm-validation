  - id: OPM-9-087
    iso: 9.5.1
    page: 31
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: >-
      An exception link connects a process that cannot complete normally (or in the expected time) with a
      process that handles the exception.
    check:
      by: shacl
      core: true
      plan: "Target every exception and invocation link: both ends are processes."
      status: implemented
    shape: |
      opms:OPM-9-087 a sh:NodeShape ; opm:rule "OPM-9-087" ; opm:profile "both" ;
          sh:targetClass opm:InvocationLink, opm:ExceptionLink ;
          sh:property [ sh:path opm:source ; sh:minCount 1 ; sh:not [ sh:class opm:Object ] ] ;
          sh:property [ sh:path opm:target ; sh:minCount 1 ; sh:not [ sh:class opm:Object ] ] ;
          sh:severity sh:Violation ; sh:message "invocation or exception link must connect two processes" .
    severity: E
    message: >-
      Link not possible: "{sentence}" must connect two processes, but "{thing}" is an object.
    hint: >-
      Exceptions and invocations connect processes. For an object that starts a process, use an event link
      ("<Object> initiates <Process>, ...").
