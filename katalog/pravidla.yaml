  - id: N-062
    iso: 12.1, Figures 11, 33, 47
    page: 69
    verified: text
    severity: medium
    what: >-
      12.1 requires links with AND semantics (links of one kind at one process) to be written as one OPL
      sentence with "and" rather than one sentence per link. The OPL of the norm's own figures does not
      follow it: Figure 11 has two sentences "Machining consumes ...", Figure 33 two agent sentences of Blade
      Replacing (with different multiplicities, which one sentence could hardly carry), Figure 47 the agents
      Payer and Payee of Delivering & Accepting in two sentences. The ISO profile therefore reports separate
      sentences as I (OPM-12-002), the OPCloud profile as E.
