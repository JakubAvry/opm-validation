    iso: 14.2.2.2 Figure 47, 9.2.2, A.4.5.3.2
    page: 83
    verified: text
    severity: low
    what: >-
      The OPL of Figure 47 writes one agent sentence for two processes ("Payer handles Writing & Signing and
      Delivering & Accepting.", and the same for Payee). The syntax statement of 9.2.2 and the agent sentence of
