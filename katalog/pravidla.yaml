  - id: N-045
    iso: 10.4.2.9, Figures 29 and 30, versus 10.3.3.2.2
    page: 63
    verified: text
    severity: low
    what: >-
      The examples enumerate attribute values without the exhibitor ("Keeper can be payer, payee, or financial
