  # ================================================================ chapter 8 Procedural link overview

  - id: OPM-8-001
    iso: 8.1.1
    page: 20
    strength: shall
    covers: 1
    source: ISO
    category: 1
    rule: "A procedural link is a transforming, an enabling or a control link."
    check:
      by: grammar
      production: "procedural sentence (A.4.5.1)"
      status: implemented
    severity: E
    message: "Not a valid OPL sentence: \"{sentence}\" ({detail})."
    hint: "Use one of the procedural sentence forms (consumes, yields, affects, changes, handles, requires, ...)."
    tests: []

  - id: OPM-8-002
    iso: 8.1.2
    page: 20
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: "Every process is connected by a transforming link to at least one object or object state."
    check:
      by: shacl
      core: true
      plan: >-
        Every process has at least one consumption, result or effect link (state-specified, event and condition
        variants included). An in-zoomed process is checked through its subprocesses; links distributed from it
        (14.2.2.4.1) count for them: links of the in-zoomed process written in the OPD of the in-zoom (its
        contour there), or any of its links when the text has no OPD paragraphs (opm:distributedTo). A process
        refined by aggregation ("P consists of P1 and P2.", the refinement of asynchronous subprocesses,
        14.2.2.5) transforms through its parts: a transforming link of a part at any depth counts.
      status: implemented
    shape: |
      opms:OPM-8-002 a sh:NodeShape ; opm:rule "OPM-8-002" ; opm:profile "both" ;
          sh:targetClass opm:Process ;
          sh:or (
              [ sh:property [ sh:path [ sh:inversePath opm:process ] ;
                              sh:qualifiedValueShape [ sh:class opm:TransformingLink ] ; sh:qualifiedMinCount 1 ] ]
              [ sh:property [ sh:path [ sh:inversePath opm:refines ] ;
                              sh:qualifiedValueShape [ sh:class opm:InZoom ] ; sh:qualifiedMinCount 1 ] ]
              [ sh:property [ sh:path [ sh:inversePath opm:distributedTo ] ;
                              sh:qualifiedValueShape [ sh:class opm:TransformingLink ] ; sh:qualifiedMinCount 1 ] ]
              [ sh:property [ sh:path ( [ sh:oneOrMorePath opm:hasPart ] [ sh:inversePath opm:process ] ) ;
                              sh:qualifiedValueShape [ sh:class opm:TransformingLink ] ; sh:qualifiedMinCount 1 ] ]
              [ sh:class opm:Object ]
          ) ;
          sh:severity sh:Violation ; sh:message "process transforms nothing" .
    severity: E
    message: "\"{process}\" does not transform anything: it neither consumes, yields nor affects an object."
    hint: "Add what \"{process}\" creates, uses up or changes, e.g. \"{process} yields <Object>.\""
    tests: []

  - id: OPM-8-003
    iso: 8.1.2
    page: 20
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: >-
      At one extent of abstraction an object (or one of its states) has exactly one role with respect to a
      process: transformee, enabler, initiator or condition.
    check:
      by: shacl
      core: true
      plan: "Shared shape of OPM-8-004."
      status: implemented
    severity: E
    message: "See OPM-8-004."
    tests: []

  - id: OPM-8-004
    iso: 8.1.2
    page: 20
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: "At one extent of abstraction an object or object state links to a process by only one procedural link."
    check:
      by: shacl
      core: false
      plan: >-
        Per OPD paragraph (extent of abstraction): between one object and one process at most one procedural
        link; an event or condition modifier and the two halves of a change are part of one link. Two links of one
        kind are two links when their states or modifier differ ("changes Book from a to b" and "affects Book",
        opm:linkSpec); the same link written twice is one; the links of one fan are separate by design, and so are
        two links with different path labels (clause 13: the label tells which of them an execution follows).
        Two links of one kind that go to different states of the object and share no state are links of two
        object states and are not reported.
        SHACL-SPARQL: two different link nodes are compared (kind, states, OPD, fan), which SHACL Core cannot do.
      status: implemented
    shape: |
      opms:OPM-8-004 a sh:NodeShape ; opm:rule "OPM-8-004" ; opm:profile "both" ;
          sh:targetClass opm:Object ;
          sh:sparql [ sh:prefixes opms:prefixes ; sh:message "object linked to a process by more than one procedural link" ;
              sh:select """
                  SELECT DISTINCT $this ?value WHERE {
                      ?l1 opm:object $this ; opm:process ?value ; a ?k1 ; opm:linkSpec ?x1 .
                      ?l2 opm:object $this ; opm:process ?value ; a ?k2 ; opm:linkSpec ?x2 .
                      FILTER (?k1 IN (opm:ConsumptionLink, opm:ResultLink, opm:EffectLink, opm:AgentLink, opm:InstrumentLink))
                      FILTER (?k2 IN (opm:ConsumptionLink, opm:ResultLink, opm:EffectLink, opm:AgentLink, opm:InstrumentLink))
                      FILTER ((?k1 != ?k2 || ?x1 != ?x2) && STR(?l1) < STR(?l2))
                      OPTIONAL { ?l1 opm:inOPD ?d1 } OPTIONAL { ?l2 opm:inOPD ?d2 }
                      FILTER ((!BOUND(?d1) && !BOUND(?d2)) || (BOUND(?d1) && BOUND(?d2) && ?d1 = ?d2))
                      FILTER NOT EXISTS { ?f opm:member ?l1 , ?l2 }
                      OPTIONAL { ?l1 opm:pathLabel ?p1 } OPTIONAL { ?l2 opm:pathLabel ?p2 }
                      FILTER (!(BOUND(?p1) && BOUND(?p2) && ?p1 != ?p2))
                      OPTIONAL { ?l1 opm:state|opm:fromState|opm:toState ?t1 }
                      OPTIONAL { ?l2 opm:state|opm:fromState|opm:toState ?t2 }
                      OPTIONAL { ?l1 opm:state|opm:fromState|opm:toState ?both .
                                 ?l2 opm:state|opm:fromState|opm:toState ?both }
                      FILTER (?k1 != ?k2 || !BOUND(?t1) || !BOUND(?t2) || BOUND(?both))
                  }""" ] ;
          sh:severity sh:Violation .
      # Links with different path labels belong to different execution paths (clause 13, Figure 43): not compared.
      # Two links of one kind at different states are links of two object states (8.1.2 "an object or any one of
      # its states", Figure 33 "consumes i inspected Blades and b - i new Blades"): reported only when one of them
      # has no state or when they share a state.
    severity: E
    message: >-
      "{object}" is linked to "{process}" twice ({links}); an object links to a process by only one procedural
      link.
    hint: >-
      Keep the strongest link (consumption = result > effect > agent > instrument, 14.2.4.1.2); e.g. a process
      that uses and changes an object only "changes" it.
    tests: []
    note: "Repeated in 14.2.4.1 (OPM-14-083)."

