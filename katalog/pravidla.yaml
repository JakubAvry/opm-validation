      norm: "State <s> of <Object> is initial."
    tests: []
    note: >-
      Without the check the converter would drop such a sentence without a report. An OPCloud
      export always writes the mark after the states of its object, so the references give no finding.

  # ================================================================ chapter 13 Execution path and path labels

  - id: OPM-13-001
    iso: "13"
    page: 77
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: >-
      A path label is a link property that pairs procedural links: the label of a link into a process is matched
      by the same label on a link out of it.
    check:
      by: shacl
      core: false
      plan: "Every path label used at a process appears on at least one link into it and one link out of it."
      status: implemented
    shape: |
      opms:OPM-13-001 a sh:NodeShape ; opm:rule "OPM-13-001" ; opm:profile "both" ;
          sh:targetClass opm:Process ;
          sh:sparql [ sh:prefixes opms:prefixes ; sh:message "path label without its counterpart" ;
              sh:select """
                  SELECT DISTINCT $this ?value WHERE {
                      ?l opm:process $this ; opm:pathLabel ?value .
                      BIND (EXISTS { ?i opm:process $this ; opm:pathLabel ?value ; a ?ki .
                                     FILTER (?ki IN (opm:ConsumptionLink, opm:EffectLink, opm:EnablingLink)) } AS ?hasIn)
                      BIND (EXISTS { ?o opm:process $this ; opm:pathLabel ?value ; a ?ko .
                                     FILTER (?ko IN (opm:ResultLink, opm:EffectLink)) } AS ?hasOut)
                      FILTER (!?hasIn || !?hasOut)
                  }""" ] ;
          sh:severity sh:Violation .
    severity: E
    message: >-
      Path label "{label}" of "{process}" has no counterpart: it is used only on links {direction} the process.
    hint: "Label the matching input and output links with the same path, e.g. \"Following path ice-to-liq, ...\"."
    tests: []

