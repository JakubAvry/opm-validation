                        sh:qualifiedMaxCount 1 ] ;
          sh:severity sh:Warning ; sh:message "process in-zoomed more than once" .
    severity: W
    message: "\"{process}\" is in-zoomed twice ({opds}); a process has one refinement."
    hint: "Merge the two in-zoom sentences, or refine one of the subprocesses instead."
    tests: []
    note: "Derived from the premise of 14.2.2.6.1.4 (stated without shall); warning only."

  - id: OPM-14-089
    iso: 14.2.4.1.2
    page: 96
    strength: shall
    covers: 4
    source: ISO
