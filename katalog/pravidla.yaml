  - id: OPM-12-022
    iso: "12.7"
    page: 76
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: "In a probabilistic link fan every link of the fan carries a probability."
    check:
      by: shacl
      core: true
      plan: >-
        On every fan: either no member link has a probability or all have one (sh:or of two property shapes over
        the fan members).
      status: implemented
    shape: |
      opms:OPM-12-022 a sh:NodeShape ; opm:rule "OPM-12-022" ; opm:profile "both" ;
          sh:targetClass opm:Fan ;
          sh:or (
              [ sh:property [ sh:path ( opm:member opm:probability ) ; sh:maxCount 0 ] ]
              [ sh:property [ sh:path opm:member ; sh:node [ sh:property [ sh:path opm:probability ; sh:minCount 1 ] ] ] ]
          ) ;
          sh:severity sh:Violation ; sh:message "probability given for some links of the fan only" .
    severity: E
    message: >-
      Probabilistic link fan incomplete: "{sentence}" gives a probability for some links but not for "{thing}".
    hint: "Give \"with probability p\" for every alternative, or for none."
    tests: []
    note: "Needs a fan node with its member links in the RDF model."

  - id: OPM-12-023
    iso: "12.7"
    page: 76
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: "The probabilities of a probabilistic link fan add up to exactly 1."
    check:
      by: shacl
      core: false
      plan: >-
        SHACL-SPARQL: sum of the numeric probabilities of the fan members equals 1 (within rounding). Fans with
        parameters (q, 0,7-q) are checked only when all values are numbers.
      status: implemented
    shape: |
      opms:OPM-12-023 a sh:NodeShape ; opm:rule "OPM-12-023" ; opm:profile "both" ;
          sh:targetClass opm:Fan ;
          sh:sparql [ sh:prefixes opms:prefixes ; sh:message "probabilities do not add up to 1" ;
              sh:select """
                  SELECT $this (SUM(?p) AS ?value) WHERE {
                      $this opm:member ?l . ?l opm:probability ?raw .
                      FILTER NOT EXISTS { $this opm:member ?l3 . OPTIONAL { ?l3 opm:probability ?r3 } FILTER (!BOUND(?r3)) }
                      FILTER NOT EXISTS { $this opm:member ?l2 . ?l2 opm:probability ?r2 .
                                          FILTER (!REGEX(STR(?r2), "^[0-9]+(?:[.,][0-9]+)?$")) }
                      BIND (xsd:decimal(REPLACE(STR(?raw), ",", ".")) AS ?p)
                  } GROUP BY $this HAVING (ABS(SUM(?p) - 1) > 0.000001)""" ] ;
          sh:severity sh:Violation .
      # Only a complete fan is summed; a member without a probability is reported by OPM-12-022.
      # (OPTIONAL + !BOUND, because rdflib 7 evaluates a FILTER NOT EXISTS nested in another one wrongly.)
    severity: E
    message: "Probabilities in \"{sentence}\" add up to {sum}, not 1."
    hint: "Adjust the probabilities so that they sum to exactly 1."
    tests: []
    note: "Core cannot add values of several nodes. The norm writes decimals with a comma (0,32); the parser accepts both."

