  # ================================================================ Annex A (normative) OPL syntax

  - id: OPM-A-001
    iso: A
    page: 98
    strength: shall
    covers: 3
    source: ISO
    category: 5
    rule: >-
      OPL expresses in text what the OPD set expresses graphically, is generated automatically, and is
      understandable without technical background.
