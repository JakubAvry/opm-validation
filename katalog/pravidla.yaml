  - id: OPM-14-054
    iso: 14.2.2.4.2
    page: 88
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: >-
      An event link does not cross the boundary of an in-zoomed process from outside to initiate one of its
      subprocesses (at any level).
    check:
      by: shacl
      core: false
      plan: >-
        For every event link whose process is a subprocess (at any depth) of an in-zoomed process: its object
        must belong to that in-zoom context (listed in the zoom sentence or linked only inside it); otherwise a
        violation. The same for an invocation or exception link (an event between two processes, 9.5.2.5.1) whose
        destination is a subprocess and whose source is neither the in-zoomed process nor one of its subprocesses.
      status: implemented
    shape: |
      opms:OPM-14-054 a sh:NodeShape ; opm:rule "OPM-14-054" ; opm:profile "both" ;
          sh:targetClass opm:EventLink, opm:InvocationLink, opm:ExceptionLink ;
          sh:sparql [ sh:prefixes opms:prefixes ; sh:message "event from outside starts a subprocess" ;
              sh:select """
                  SELECT $this ?value WHERE {
                      {
                          $this opm:process ?sub ; opm:object ?o .
                          ?sub opm:subprocessOf+ ?value .
                          FILTER NOT EXISTS { ?o opm:interimOf ?value }
                          FILTER NOT EXISTS { ?r a opm:ResultLink ; opm:object ?o ; opm:process ?s2 . ?s2 opm:subprocessOf+ ?value }
                          FILTER NOT EXISTS { ?o opm:subprocessOf ?value }
                      } UNION {
                          $this opm:source ?src ; opm:target ?sub .
                          ?sub opm:subprocessOf+ ?value .
                          FILTER (?src != ?value)
                          FILTER NOT EXISTS { ?src opm:subprocessOf+ ?value }
                      }
                  }""" ] ;
          sh:severity sh:Violation .
      # Second branch: an invocation or exception link is an event too (9.5.2.5.1 "process invocation shall be an
      # event"; both are links of 9.5.2 / 9.5.4 that initiate their destination): from a process outside the
      # in-zoomed process to one of its subprocesses.
    severity: E
    message: >-
      "{sentence}": the event comes from "{object}" outside the in-zoomed "{process}" and would start its
      subprocess "{subprocess}" out of order.
    hint: "Let the event initiate \"{process}\" itself, or move \"{object}\" into its in-zoom context."
    tests: []

  - id: OPM-14-055
    iso: 14.2.2.4.3
    page: 88
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: >-
      After in-zooming a process that changes an object from one state to another, the input and output links
      go to subprocesses in a temporally feasible way (one subprocess, or the input to an earlier one and the
      output to a later one).
    check:
      by: shacl
      core: false
      plan: >-
        (a) A change link on the in-zoomed process inside its own in-zoom paragraph is underspecified;
        (b) in a split pair ("P1 changes A from s1." / "P2 changes A to s2.") the input subprocess does not come
        after the output subprocess in the zoom order.
      status: implemented
    shape: |
      opms:OPM-14-055 a sh:NodeShape ; opm:rule "OPM-14-055" ; opm:profile "both" ;
          sh:targetClass opm:ChangeLink ;
          sh:sparql [ sh:prefixes opms:prefixes ; sh:message "change on an in-zoomed process or split in the wrong order" ;
              sh:select """
                  SELECT $this ?value WHERE {
                      { $this opm:process ?value ; opm:inOPD ?d . ?z a opm:InZoom ; opm:refines ?value ; opm:childOPD ?d .
                        $this opm:fromState ?f ; opm:toState ?t . }
                      UNION
                      { $this opm:process ?out ; opm:object ?o ; opm:toState ?t .
                        FILTER NOT EXISTS { $this opm:fromState ?any }
                        ?in a opm:ChangeLink ; opm:process ?value ; opm:object ?o ; opm:fromState ?f .
                        FILTER NOT EXISTS { ?in opm:toState ?any2 }
                        ?out opm:subprocessOf ?p ; opm:stepOrder ?n1 . ?value opm:subprocessOf ?p ; opm:stepOrder ?n2 .
                        FILTER (?n2 > ?n1) }
                  }""" ] ;
          sh:severity sh:Violation .
    severity: E
    message: "{detail}: \"{sentence}\" (ISO 14.2.2.4.3)."
    hint: "Attach the change to the subprocess that does it, or split it: the earlier subprocess \"from\", the later \"to\"."
    tests: []

