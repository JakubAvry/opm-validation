  - id: OPM-8-008
    iso: 8.2.2
    page: 21
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: >-
      Every process has a preprocess object set with at least one object: something it consumes, affects or
      needs as an enabler.
    check:
      by: shacl
      core: true
      plan: >-
        Every process has at least one consumption, effect, agent or instrument link (any variant). Exceptions:
        an in-zoomed process is checked through its subprocesses: one of them (at any depth) has such a link,
        or the in-zoomed process has it itself; a subprocess has the implicit invocation of 14.2.2.1; an
        invoked process has the implicit interim object of the invocation (9.5.2.5.1, NOTE).
      status: implemented
    shape: |
      opms:OPM-8-008 a sh:NodeShape ; opm:rule "OPM-8-008" ; opm:profile "both" ;
          sh:targetClass opm:Process ;
          sh:or (
              [ sh:property [ sh:path [ sh:inversePath opm:process ] ; sh:qualifiedMinCount 1 ;
                              sh:qualifiedValueShape [ sh:or ( [ sh:class opm:ConsumptionLink ] [ sh:class opm:EffectLink ]
                                                               [ sh:class opm:EnablingLink ] ) ] ] ]
              [ sh:property [ sh:path ( [ sh:oneOrMorePath [ sh:inversePath opm:subprocessOf ] ]
                                        [ sh:inversePath opm:process ] ) ; sh:qualifiedMinCount 1 ;
                              sh:qualifiedValueShape [ sh:or ( [ sh:class opm:ConsumptionLink ] [ sh:class opm:EffectLink ]
                                                               [ sh:class opm:EnablingLink ] ) ] ] ]
              [ sh:property [ sh:path [ sh:inversePath opm:target ] ; sh:qualifiedMinCount 1 ;
                              sh:qualifiedValueShape [ sh:or ( [ sh:class opm:InvocationLink ] [ sh:class opm:ExceptionLink ] ) ] ] ]
