  - id: OPM-9-170
    iso: 9.5.4.1
    page: 44
    strength: implicit
    covers: 0
    source: ISO
    category: 2
    rule: >-
      The Minimal Duration of a process does not exceed its Maximal Duration (they are the minimum and the
      maximum allowed time for completing the process).
    check:
      by: shacl
      core: true
      plan: >-
        The converter gives a process its minimal and maximal duration as numbers (opm:minDurationValue,
        opm:maxDurationValue) when both are stated in the same unit: by the duration sentences of OPCloud or by an
        undertime and an overtime exception link (9.5.4.2, 9.5.4.3). SHACL Core: sh:lessThanOrEquals.
      status: implemented
    shape: |
      opms:OPM-9-170 a sh:NodeShape ; opm:rule "OPM-9-170" ; opm:profile "both" ;
          sh:targetSubjectsOf opm:minDurationValue ;
          sh:property [ sh:path opm:minDurationValue ; sh:lessThanOrEquals opm:maxDurationValue ] ;
          sh:severity sh:Warning ; sh:message "minimal duration exceeds maximal duration" .
    severity: W
    message: >-
      The minimal duration of "{process}" ({min}) exceeds its maximal duration ({max}).
    hint: "Make the minimal duration at most the maximal one (or swap \"exceeds\" and \"falls short of\")."
    tests: []
    note: >-
      Not stated with a modal verb: a consequence of the definition of the two attributes (OPM-9-161), so
      reported as W. Durations in different units are
      not compared.

  # ================================================================ chapter 10 Structural links
  # ---------------------------------------------------------------- 10.1 Kinds of structural links

  - id: OPM-10-001
    iso: "10.1"
    page: 45
    strength: shall
    covers: 1
    source: ISO
    category: 2
    rule: >-
      A structural link connects objects with objects or processes with processes, never an object with a
      process, except the exhibition-characterization link.
    check:
      by: shacl
      core: true
      plan: >-
        Target every structural link except exhibition: all its ends are objects (or states of objects), or all
        are processes.
      status: implemented
    shape: |
      opms:OPM-10-001 a sh:NodeShape ; opm:rule "OPM-10-001" ; opm:profile "both" ;
          sh:targetClass opm:AggregationLink, opm:GeneralizationLink, opm:ClassificationLink, opm:TaggedLink ;
          sh:not [ sh:or (
              [ sh:property [ sh:path opm:source ; sh:class opm:Object ] ; sh:property [ sh:path opm:target ; sh:class opm:Process ] ]
              [ sh:property [ sh:path opm:source ; sh:class opm:Process ] ; sh:property [ sh:path opm:target ; sh:class opm:Object ] ]
          ) ] ;
          sh:severity sh:Violation ; sh:message "structural link between an object and a process" .
    severity: E
    message: >-
      Link not possible: "{sentence}" connects an object with a process; only exhibition ("exhibits") may do
      that.
    hint: >-
      Make one thing a feature of the other ("<Object> exhibits <Process>."), or connect them with a procedural
      link.
    tests: []

  - id: OPM-10-002
    iso: "10.1"
    page: 45
    strength: shall
    covers: 1
    source: ISO
    category: 1
    rule: >-
      The kinds of structural links are the tagged links and the four fundamental ones: aggregation,
      exhibition, generalization, classification.
    check:
      by: grammar
      production: "structural sentence (A.4.6.1)"
      status: implemented
    severity: E
    message: "Not a valid OPL sentence: \"{sentence}\" ({detail})."
    hint: "Use a tag between two things, or consists of / exhibits / are / is an instance of."
    tests: []
    note: "Closed set enforced by the grammar, as OPM-9-002."

