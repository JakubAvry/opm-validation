  # ---------------------------------------------------------------- chapter 11

  - id: N-037
    iso: 11.1-11.3 versus Table 16, Figures 32-34, 26, Annex A.3.2
    page: 65
    verified: text
    severity: medium
    what: >-
      A range ".." shall read "through" in OPL, but the examples and Annex A write "to" ("3 to 5 or 8 to 10
      Machines", "k=2 to 4"; OPCloud too). The range sentence shall be "Attribute of Object range is
      value-range", the examples and Annex A write "... ranges from <min> to <max>". The plural rule is broken by
      the examples: "Car carries at least one Spare Tire." (several possible, singular) and "b Engines" with b in
      {0, 1}. Figure 33 writes constraints inline ("k=2 to 4", "a <= b inspected Blades") instead of ", where
      ...", uses "many", which clause 11 does not define, and names a parameter "a", like the article.
      The semicolon-separated constraint list of 11.2 concerns the OPD annotation, so Figure 34's commas in OPL
      are no contradiction.

  - id: N-038
    iso: Annex A.1, A.3.2 versus 11.1-11.3
    page: 98
    verified: text (s104, s105)
    severity: medium
    what: >-
      Annex A states itself that it is incomplete: no productions for probabilities (12.7), execution paths
      (clause 13) and most participation constraints. It defines only a single range "<limit> to <limit>", the
      phrases of upper single / lower plural ("an optional", "at least one", "optional", "many") and a constraint
      " where <name> <operator> <value>" or a set; no "or" between ranges and no expressions. Its participation
      limit allows a positive real number, while 11.3 says multiplicity values are integers. The base
      declaration of logical operations writes " >=" with a space inside the literal. A.3.2 also misses commas
      between elements in some declarations, and NOTE 3 and NOTE 4 give the two quote symbols a meaning that
      ISO/IEC 14977 does not have.

