  - id: N-060
    iso: 8.1.2 versus 9.3.3, 9.5.2
    page: 20
    verified: text
    severity: medium
    what: >-
      8.1.2 gives an object exactly one role per process (transformee, enabler, initiator or conditional object)
      and allows only one procedural link between them. An agent event link makes the agent both initiator and
      enabler ("Agent initiates and handles Process."), and an input-output-specified effect link is defined as
      a pair of links (9.3.3). The catalogue reads a control modifier and the two halves of a change as parts of
      one link (OPM-8-004).

